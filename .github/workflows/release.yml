name: release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - gen-contracts/**
      - contracts/**
      - .github/workflows/release.yml
      - scripts/install.ps1
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.existing.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      - name: Read the package version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mootbox-daemon") | .version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::cannot read the mootbox-daemon version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2> lookup.err; then
            echo "$TAG is already released; nothing to publish"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q "release not found" lookup.err; then
            echo "$TAG is new; releasing"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat lookup.err >&2
          echo "::error::cannot check whether $TAG is already released"
          exit 1

  build:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: mootbox-linux-x64.tar.gz
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            asset: mootbox-linux-arm64.tar.gz
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            asset: mootbox-macos-x64.tar.gz
            os: macos-14
          - target: aarch64-apple-darwin
            asset: mootbox-macos-arm64.tar.gz
            os: macos-14
          - target: x86_64-pc-windows-msvc
            asset: mootbox-windows-x64.zip
            os: windows-2022
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
      VERSION: ${{ needs.plan.outputs.version }}
      EXECUTABLE: ${{ startsWith(matrix.os, 'windows-') && 'mootbox.exe' || 'mootbox' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain and target
        run: |
          rustup toolchain install --profile minimal
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Native Windows checks
        if: runner.os == 'Windows'
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build
        run: |
          if [[ "$TARGET" == *-windows-msvc ]]; then
            RUSTFLAGS='-C target-feature=+crt-static' cargo build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
      - name: Smoke-run the binary
        run: |
          printed="$("target/$TARGET/release/$EXECUTABLE" --version | tr -d '\r')"
          if [ "$printed" != "mootbox $VERSION" ]; then
            echo "::error::the $TARGET build printed '$printed', expected 'mootbox $VERSION'"
            exit 1
          fi
          echo "$printed"
      - name: Package the archive
        if: runner.os != 'Windows'
        run: |
          rm -rf staging
          mkdir staging
          cp "target/$TARGET/release/mootbox" staging/mootbox
          cp README.md staging/README.md
          chmod 0755 staging/mootbox
          chmod 0644 staging/README.md
          COPYFILE_DISABLE=1 tar -czf "$ASSET" -C staging mootbox README.md
          tar -tzvf "$ASSET"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory staging | Out-Null
          Copy-Item "target/$env:TARGET/release/mootbox.exe" staging/mootbox.exe
          Copy-Item README.md staging/README.md
          Compress-Archive -Path staging/* -DestinationPath $env:ASSET
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mootbox-*
          merge-multiple: true
      - name: Write SHA256SUMS
        run: |
          cp scripts/install.ps1 install.ps1
          sha256sum mootbox-*.tar.gz mootbox-*.zip install.ps1 > SHA256SUMS
          cat SHA256SUMS
      - name: Write the release notes
        run: |
          printf 'mootbox %s runs your own signed-in Claude Code or Codex for the Mootbox chats you start.\n\n' "$TAG" > notes.md
          cat >> notes.md <<'NOTES'
          ## Install

          Run inside the git repository you want to connect. It installs `mootbox` to `~/.mootbox/bin` and connects the repository:

          ```sh
          curl -fsSL https://mootbox.zbib.dev/install | sh
          ```

          Native Windows 10/11 (PowerShell, inside your repository):

          ```powershell
          & ([scriptblock]::Create((Invoke-RestMethod https://github.com/mootboxhq/mootbox-daemon/releases/latest/download/install.ps1)))
          ```

          This installs `mootbox.exe` for your Windows account and starts the browser confirmation flow. No WSL or administrator terminal is needed. Git for Windows and your signed-in provider CLI are required.

          Already installed? Update in place:

          ```sh
          mootbox update
          ```

          ## Downloads

          | Platform | File |
          | --- | --- |
          | macOS Apple silicon | `mootbox-macos-arm64.tar.gz` |
          | macOS Intel | `mootbox-macos-x64.tar.gz` |
          | Linux x86_64 | `mootbox-linux-x64.tar.gz` |
          | Linux ARM64 | `mootbox-linux-arm64.tar.gz` |

          | Native Windows x64 | `mootbox-windows-x64.zip` |

          Archives hold `mootbox` (`mootbox.exe` on Windows) and `README.md`.

          ## Verify

          Download `SHA256SUMS` next to the archive, then on Linux:

          ```sh
          sha256sum -c --ignore-missing SHA256SUMS
          ```

          or on macOS:

          ```sh
          shasum -a 256 -c --ignore-missing SHA256SUMS
          ```

          NOTES
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "mootbox $TAG" \
            --notes-file notes.md \
            --generate-notes \
            mootbox-*.tar.gz mootbox-*.zip install.ps1 SHA256SUMS
