[package]
name = "mootbox-daemon"
version = "0.1.2"
edition = "2024"

[[bin]]
name = "mootbox"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
hostname = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
fastrand = "2.5.0"
regress = "0.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "process", "signal", "sync", "io-util"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["hostname", "process", "signal", "user"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "9.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
self-replace = "1.5"

[dev-dependencies]
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace]
members = ["gen-contracts"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[lints]
workspace = true
